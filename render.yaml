services:
  - type: web
    name: tastetwin-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: bash scripts/build-render.sh
    startCommand: uvicorn app.main:app --app-dir apps/api --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_MODE
        value: fixture
      - key: WEB_ORIGINS
        sync: false
